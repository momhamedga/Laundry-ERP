name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly regression run — 03:00 UTC
    - cron: "0 3 * * *"

# Cancel superseded runs on the same ref (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # يُرضي مُتحقّق config/env.ts أثناء typecheck/build/tests بلا أسرار حقيقية
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/laundry_ci"
  JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
  JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"

jobs:
  # ==================== Backend (API) ====================
  api:
    name: API (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @laundry/api exec prisma generate

      - name: TypeScript
        run: pnpm --filter @laundry/api typecheck

      - name: Unit tests + coverage
        run: pnpm --filter @laundry/api test:coverage

      - name: Build
        run: pnpm --filter @laundry/api build

      - name: Upload API coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn
          retention-days: 14

  # ==================== Integration (API + real Postgres) ====================
  # طبقة التكامل الحقيقية: HTTP + Prisma + Postgres فعلي داخل خدمة سريعة الزوال.
  # القاعدة معزولة تماماً (schema=integration_test) وتُدمَّر مع الـ job، ويُسقَط
  # الschema صراحةً بعد التشغيل (DROP_TEST_SCHEMA=1). لا علاقة بقاعدة التطوير.
  integration:
    name: Integration (API + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # قاعدة اختبار محلية داخل خدمة CI؛ مُتحقّق التكامل يشتقّ schema=integration_test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/laundry_test"
      JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
      JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"
      DROP_TEST_SCHEMA: "1" # تنظيف صريح للschema بعد انتهاء المجموعة
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @laundry/api exec prisma generate

      - name: TypeScript
        run: pnpm --filter @laundry/api typecheck

      - name: Build
        run: pnpm --filter @laundry/api build

      - name: Unit tests
        run: pnpm --filter @laundry/api test

      # globalSetup يشغّل `prisma migrate deploy` على schema=integration_test، ثم
      # تُشغَّل كل سويتات التكامل، ثم يُسقَط الschema (DROP_TEST_SCHEMA=1).
      - name: Integration tests (migrate + run + drop schema)
        run: pnpm --filter @laundry/api test:integration

  # ==================== Frontend (Admin) ====================
  admin:
    name: Admin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (types shared via @prisma/client)
        run: pnpm --filter @laundry/api exec prisma generate

      - name: TypeScript
        run: pnpm --filter @laundry/admin type-check

      - name: ESLint
        run: pnpm --filter @laundry/admin lint

      - name: Unit tests + coverage
        run: pnpm --filter @laundry/admin test:coverage

      - name: Build
        run: pnpm --filter @laundry/admin build

      - name: Upload Admin coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: admin-coverage
          path: apps/admin/coverage
          if-no-files-found: warn
          retention-days: 14

  # ==================== Quality Gate ====================
  # فحص تجميعي واحد يُشترط في حماية الفرع: يفشل إن فشل أي job أعلاه.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [api, integration, admin]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.admin.result }}" != "success" ]; then
            echo "❌ One or more required checks failed."
            exit 1
          fi
          echo "✅ All checks passed — merge allowed."
