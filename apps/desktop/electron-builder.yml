appId: com.laundryerp.desktop
productName: Laundry ERP
copyright: Copyright © 2026 Laundry ERP

# ربط أنواع ملفّات التطبيق (يفتحها البرنامج مباشرة)
fileAssociations:
  - ext: laundry
    name: Laundry ERP Document
    role: Editor
  - ext: invoice
    name: Laundry Invoice
    role: Viewer
  - ext: receipt
    name: Laundry Receipt
    role: Viewer

directories:
  output: release
  buildResources: build

# ملفّات التطبيق داخل asar (الـ main + preload المُترجَمان + تبعيات Electron فقط)
files:
  - dist/**/*
  - package.json

# موارد خارجية تُشغَّل كعمليات Node مدمجة (لا داخل asar): الـ API المبني وواجهة
# Next standalone. تُنسخ من مخرجات البناء قبل التغليف (انظر README).
extraResources:
  - from: ../../resources/api
    to: api
    filter: ["**/*"]
  - from: ../../resources/renderer
    to: renderer
    filter: ["**/*"]
  - from: build
    to: build
    filter: ["icon.*"]

asar: true
compression: normal

# ==================== Windows ====================
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  # تضمين الأيقونة وبيانات الإصدار (ProductName/CompanyName/Copyright/Version) في
  # موارد الـexe عبر rcedit — وهي ما يقرأه Explorer وTask Manager وSmartScreen.
  #
  # يتطلّب أداة winCodeSign في كاش electron-builder. أرشيفها يحوي روابط رمزية لـ
  # macOS لا تُستخرَج على Windows بلا صلاحية، فيفشل التغليف بالكامل (rc=1) حتى بلا
  # شهادة توقيع. الحلّ: scripts/prepare-wincodesign.mjs يستخرجها مستثنياً darwin/
  # ويُشغَّل تلقائياً ضمن package:win / dist / package:dir (Phase 12.3).
  #
  # التوقيع نفسه يُتخطّى بأمان بلا شهادة ("no signing info identified") ولا يُفشِل
  # البناء. لتوقيع حقيقي أضِف شهادة عبر win.signtoolOptions.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Laundry ERP

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# ==================== Linux ====================
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

# ==================== macOS (Ready — يُبنى على جهاز macOS فقط) ====================
mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.icns

# ==================== Updater (مُفعَّل v1.3.0 عبر GitHub Releases) ====================
publish:
  provider: github
  owner: momhamedga
  repo: Laundry-ERP
