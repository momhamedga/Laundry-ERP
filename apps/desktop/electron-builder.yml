appId: com.laundryerp.desktop
productName: Laundry ERP
copyright: Copyright © 2026 Laundry ERP

# ربط أنواع ملفّات التطبيق (يفتحها البرنامج مباشرة)
fileAssociations:
  - ext: laundry
    name: Laundry ERP Document
    role: Editor
  - ext: invoice
    name: Laundry Invoice
    role: Viewer
  - ext: receipt
    name: Laundry Receipt
    role: Viewer

directories:
  output: release
  buildResources: build

# ملفّات التطبيق داخل asar (الـ main + preload المُترجَمان + تبعيات Electron فقط)
files:
  - dist/**/*
  - package.json

# موارد خارجية تُشغَّل كعمليات Node مدمجة (لا داخل asar): الـ API المبني وواجهة
# Next standalone. تُنسخ من مخرجات البناء قبل التغليف (انظر README).
extraResources:
  - from: ../../resources/api
    to: api
    filter: ["**/*"]
  - from: ../../resources/renderer
    to: renderer
    filter: ["**/*"]
  - from: build
    to: build
    filter: ["icon.*"]

asar: true
compression: normal

# ==================== Windows ====================
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  # تخطّي تعديل/توقيع الـexe عبر rcedit: يتطلّب أداة winCodeSign التي تحوي روابط
  # رمزية macOS لا تُستخرَج على Windows بلا صلاحية (وضع المطوّر/مسؤول). إبقاؤه false
  # يجعل البناء يعمل على أي جهاز Windows. أعِده إلى true على جهاز توقيع/وضع مطوّر
  # مع إضافة build/icon.ico لدمج الأيقونة/التوقيع في الـexe.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Laundry ERP

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# ==================== Linux ====================
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

# ==================== macOS (Ready — يُبنى على جهاز macOS فقط) ====================
mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.icns

# ==================== Updater (مُفعَّل v1.3.0 عبر GitHub Releases) ====================
publish:
  provider: github
  owner: momhamedga
  repo: Laundry-ERP
