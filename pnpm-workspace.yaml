packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# ==================== إصلاحات أمنية (v1.4.0) ====================
# تُفرَض على شجرة التبعيات كاملة لإغلاق ثغرات معلَنة في حزم انتقالية لا يمكن
# ترقيتها عبر مالكها (exceljs 4.4.0 هو الأحدث بالفعل، وpostcss/sharp داخل شجرة Next).
#   brace-expansion : DoS/OOM   (GHSA) — ترقيات patch فقط
#   postcss         : XSS + قراءة ملفات + اجتياز مسار عبر sourceMappingURL
#   sharp           : ثغرات libvips الموروثة (CVE-2026-33327/33328)
# مستثنى عمداً: uuid — الثغرة تخصّ v3/v5/v6 مع معامل buf، وexceljs تستدعي v4() فقط
# (تحقُّق: `const {v4: uuidv4} = require('uuid')`)، فترقية major 8→11 خطر بلا فائدة.
overrides:
  # fast-uri <3.1.5: التباس مضيف عبر شرطة مائلة عكسية. يصل عبر
  # electron-store>conf>ajv وهو مشحون داخل asar. الترقيع داخل نفس الإصدار
  # الرئيسي (3.x) فلا يكسر واجهة ajv.
  fast-uri: "^3.1.5"
  # ip-address <=10.3.0: يفكّ Address4 الأصفار البادئة كعشري بينما تفكّها
  # المُحلِّلات كثُماني ⇒ التباس عنوان يسمح بتجاوز تحديد المعدّل. مشحونة عبر
  # express-rate-limit في الـ API (تحديد معدّل تسجيل الدخول واستعادة كلمة المرور).
  ip-address: "^10.3.1"
  "brace-expansion@1": "^1.1.17"
  "brace-expansion@2": "^2.1.3"
  "brace-expansion@5": "^5.0.8"
  postcss: "^8.5.25"
  sharp: "^0.35.3"
# ==================== سكربتات البناء المُقرَّة ====================
# pnpm يحجب سكربتات install/postinstall افتراضياً ويفشل التثبيت بـ
# ERR_PNPM_IGNORED_BUILDS حتى تُقَرّ كل حزمة صراحةً هنا.
#
# كانت better-sqlite3-multiple-ciphers غائبة عن القائمة — وهي المستخدمة فعلياً
# (تحمل تشفير SQLCipher لقاعدة الأوفلاين)، لا النسخة العادية المذكورة. فكان
# `pnpm install --frozen-lockfile` يفشل على كل دفعة، وبقي CI أحمر بلا انتباه.
#
# كل اسم هنا يُشغِّل شيفرة أثناء التثبيت — قائمة مقصودة لا تُوسَّع بلا سبب.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  # better-sqlite3 العادية مُستخدَمة كنوع فقط: `import type` في base.ts وإعلان
  # الوحدة في types/. المخرج المُترجَم لا يحمّلها إطلاقاً (صفر require)، فبناء
  # ملحقها الأصلي عملٌ بلا مستفيد — ويفشل على إصدارات Node التي لا يوجد لها
  # ملحق جاهز، فيمنع كل أمر pnpm محلّياً.
  better-sqlite3: false
  better-sqlite3-multiple-ciphers: true # الملحق الأصلي لقاعدة الأوفلاين المشفّرة
  electron: true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
